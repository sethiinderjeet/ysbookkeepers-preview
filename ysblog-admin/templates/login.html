{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<div class="login-card">
  <img src="/assets/img/ys-tax-advisory-logo.png" alt="YS Tax &amp; Advisory" class="login-logo">
  <h1>Sign in</h1>
  <form method="post" autocomplete="on">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Username<input name="username" autocomplete="username" maxlength="50" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
    <button class="btn">Sign in</button>
  </form>
</div>
{% endblock %}
