{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="panel narrow">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Current password<input type="password" name="current" autocomplete="current-password" maxlength="128" required></label>
  <label>New password <small>(at least {{ min_len }} characters)</small><input type="password" name="new" minlength="{{ min_len }}" maxlength="128" autocomplete="new-password" required></label>
  <label>Repeat new password<input type="password" name="confirm" minlength="{{ min_len }}" maxlength="128" autocomplete="new-password" required></label>
  <div class="row-actions"><button class="btn">Save new password</button><a href="{{ url_for('admin.dashboard') }}">Cancel</a></div>
</form>
{% endblock %}
